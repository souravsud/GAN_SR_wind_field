; CPU smoke-test config for a 12-core workstation (no GPU required).
;
; Goal: verify the full training pipeline (data loading, forward/backward pass,
; validation, checkpointing, logging) completes without errors.  Training speed
; will be slow — this is intentional.  Use a tiny model, a tiny crop, and only
; a handful of iterations.
;
; Key CPU-friendly choices:
;   gpu_id          — omitted (no value) → falls back to torch.device("cpu")
;   use_mixed_precision = False          → avoids CUDA autocast/GradScaler
;   num_workers     = 4                  → use ~4 of the 12 cores for data loading
;   batch_size      = 1                  → keeps memory manageable on CPU
;   crop_nx/ny      = 40, number_of_z_layers = 8  → tiny spatial volume
;   num_features    = 16, num_RRDB = 2   → tiny generator/discriminator
;   niter           = 20                 → just enough to exercise every code path
;   val_period / save_model_period / log_period tuned to fire within 20 iters

[DEFAULT]

name                    = local_cpu_test
model                   = wind_field_GAN_3D
use_tensorboard_logger  = True
scale                   = 4
; Leave gpu_id blank (no value) → code falls back to CPU automatically
gpu_id
also_log_to_terminal    = True
load_model_from_save    = False
display_bar             = True


[ENV]
data_path               = /data
; download_path: unused fallback folder (data_source takes precedence)
download_path           = /data_cache
processed_data_path     = /full_dataset_files
log_subpath             = /log
tensorboard_subpath     = /tensorboard_log
runs_subpath            = /runs
fixed_seed              = 42
generator_load_path
discriminator_load_path
state_load_path
dataset                 = wind_terrain
; Set this to the root of your Wind-Terrain NPZ dataset (must contain data/ and case_index.csv)
data_source             = /path/to/wind_terrain_dataset
; pt_cache_path: where to write/read PT files (leave blank = same dir as NPZ)
pt_cache_path           =


[GAN]
include_pressure                = False
include_z_channel               = True
include_above_ground_channel    = False
; Very shallow vertical crop — keeps tensor volume tiny on CPU
number_of_z_layers              = 8
conv_mode                       = 3D
; Use only 6 cases total: 5 train/val + 1 test
sample_start                    = 1
sample_end                      = 6
; Tiny spatial crop (must be divisible by scale=4)
crop_nx                         = 40
crop_ny                         = 40
use_D_feature_extractor_cost    = False
enable_slicing                  = False
slice_size                      = 32
z_skip                          = 0
preload_to_ram                  = False


[DATASETTRAIN]
num_workers     = 4
batch_size      = 1
name            = WholeDataSet
data_aug_flip   = True
data_aug_rot    = True


[DATASETVAL]
num_workers     = 4
batch_size      = 1
name            = Validation
data_aug_rot    = True
data_aug_flip   = True


[DATASETTEST]
mode    = hrlr
name    = Test


[GENERATOR]
norm_type               = 'l1'
act_type                = leakyrelu
layer_mode              = CNA
; Tiny model — fast on CPU
num_features            = 16
terrain_number_of_features = 8
num_RRDB                = 2
num_RDB_convs           = 3
RDB_res_scaling         = 0.2
RRDB_res_scaling        = 0.2
in_num_ch               = 3
out_num_ch              = 3
RDB_growth_chan         = 16
hr_kern_size            = 3
weight_init_scale       = 0.1
lff_kern_size           = 1
dropout_probability     = 0.0
max_norm                = 1.0
conv_mode               = 3D
; Disable mixed precision — not supported / useful on CPU
use_mixed_precision     = False


[DISCRIMINATOR]
norm_type               = batch
act_type                = leakyrelu
layer_mode              = CNA
num_features            = 16
in_num_ch               = 3
feat_kern_size          = 3
weight_init_scale       = 0.2
dropout_probability     = 0.0
conv_mode               = 3D
; Disable mixed precision — not supported / useful on CPU
use_mixed_precision     = False


[TRAINING]
resume_training_from_save   = False
learning_rate_g             = 8e-5
learning_rate_d             = 8e-5
adam_weight_decay_g         = 0
adam_weight_decay_d         = 0
adam_beta1_g                = 0.9
adam_beta1_d                = 0.9

multistep_lr        = True
multistep_lr_steps  = [10, 15]
lr_gamma            = 0.5
gan_type            = relativisticavg

adversarial_loss_weight     = 0.0005
feature_D_loss_weight       = 0.05
feature_D_update_period     = 5
gradient_xy_loss_weight     = 3.064
gradient_z_loss_weight      = 0.0
xy_divergence_loss_weight   = 0.721
divergence_loss_weight      = 0.366
pixel_loss_weight           = 0.136
pixel_criterion             = l1

d_g_train_ratio     = 1
d_g_train_period    = 5
use_noisy_labels    = False

use_one_sided_label_smoothing   = True
flip_labels                     = False
use_instance_noise              = True

; 20 iterations is enough to exercise all code paths without taking forever
niter               = 20
val_period          = 5
save_model_period   = 10
log_period          = 5
train_eval_test_ratio = 0.6

; CUDA memory history — set record_memory_history = True on a GPU run to capture
; a full allocation timeline. Snapshot is saved to runs/<name>/ at the given iteration.
; Has no effect when gpu_id is blank (CPU mode).
record_memory_history       = False
memory_snapshot_iteration   = 10
