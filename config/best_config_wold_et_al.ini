[DEFAULT]
name = Tuned_Model
model = wind_field_GAN_3D
use_tensorboard_logger = True
scale = 4
also_log_to_terminal = True
gpu_id = 0
load_model_from_save = False
display_bar = True

[ENV]
data_path = /data
# download_path is unused for the Zarr dataset but kept for config compatibility
download_path = /zarr_data_cache
processed_data_path = /full_dataset_files
interpolated_z_data_path = /interpolated_z_data
log_subpath  = /log
tensorboard_subpath = /tensorboard_log
runs_subpath = /runs
fixed_seed = 2001
# If this has a value, and load_model_from_save = True, then G is loaded from this.
generator_load_path
# If this has a value, and load_model_from_save = True, then D is loaded from this.
discriminator_load_path
# If this has a value,  load_model_from_save = True, and resume_training_from_save = True then training is resumed from this state.
state_load_path
dataset = wind_terrain
# data_source: path to the dataset root (must contain data/ and metadata/)
data_source = /path/to/wind_terrain_dataset

[GAN]
include_pressure = False
include_z_channel = True
include_above_ground_channel = False
# number_of_z_layers: vertical layers kept from ground up (k=0 is ground).
# Also controls the model z-dimension — set equal to crop_nk.
number_of_z_layers = 30
conv_mode = 3D
# Sample range: 1-based row indices in metadata/case_index.csv (inclusive).
sample_start = 1
sample_end = 100
# Spatial crop: centre-cropped from 300x300. Must be divisible by scale.
crop_nx = 200
crop_ny = 200
interpolate_z = False
use_D_feature_extractor_cost = False
enable_slicing = False
slice_size = 64

[GENERATOR]
norm_type = 'l1'
act_type = leakyrelu
layer_mode = CNA
num_features = 128
num_RRDB = 16
num_RDB_convs = 5
RDB_res_scaling = 0.2
RRDB_res_scaling = 0.2
in_num_ch = 3
out_num_ch = 3
RDB_growth_chan = 32
hr_kern_size = 5
weight_init_scale = 0.1
lff_kern_size = 1
conv_mode = 3D
use_mixed_precision = True
terrain_number_of_features = 16
dropout_probability = 0.1
max_norm = 1.0

[DISCRIMINATOR]
norm_type = batch
act_type = leakyrelu
layer_mode = CNA
num_features = 32
in_num_ch = 3
feat_kern_size = 3
weight_init_scale = 0.2
conv_mode = 3D
use_mixed_precision = True
dropout_probability = 0.2

[TRAINING]
resume_training_from_save = False
learning_rate_g = 8e-05
learning_rate_d = 8e-05
adam_weight_decay_g = 0.0
adam_weight_decay_d = 0.0
adam_beta1_g = 0.9
adam_beta1_d = 0.9
multistep_lr = True
multistep_lr_steps = [10000, 30000, 50000, 70000, 100000]
lr_gamma = 0.5
gan_type = relativisticavg
adversarial_loss_weight = 0.0
d_g_train_ratio = 0
d_g_train_period = 50
pixel_criterion = l1
pixel_loss_weight = 0.136
gradient_xy_loss_weight = 3.064
gradient_z_loss_weight = 0.0
divergence_loss_weight = 0.366
xy_divergence_loss_weight = 0.721
feature_D_loss_weight = 0.05
use_noisy_labels = False
use_one_sided_label_smoothing = True
use_instance_noise = True
flip_labels = False
niter = 100000
val_period = 2000
save_model_period = 5000
log_period = 1000
conv_mode = 3D
train_eval_test_ratio = 0.8
feature_D_update_period = 10000

[DATASETTRAIN]
name = WholeDataSet
num_workers = 4
batch_size = 1
data_aug_flip = True
data_aug_rot = True

[DATASETVAL]
name = Validation
num_workers = 4
batch_size = 1
data_aug_flip = True
data_aug_rot = True

[DATASETTEST]
name = Test
mode = hrlr
num_workers = 4
batch_size = 1
data_aug_flip = True
data_aug_rot = True
